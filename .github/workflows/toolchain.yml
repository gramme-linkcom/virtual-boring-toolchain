name: build-toolchain

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例: toolchain-2026-10-05)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-opencv

      - name: Diagnose OpenCV files
        shell: msys2 {0}
        run: |
          pacman -Ql mingw-w64-ucrt-x86_64-opencv | grep -E '\.pc$|OpenCVConfig\.cmake$' || true
          ls /ucrt64/lib/pkgconfig | grep -i opencv || true

      - name: Smoke test (CMake で OpenCV をリンクできるか)
        shell: msys2 {0}
        run: |
          g++ --version
          cmake --version
          ninja --version
          mkdir smoke && cd smoke
          printf '#include <opencv2/opencv.hpp>\nint main(){cv::Mat m(2,2,CV_8UC1);return m.empty();}\n' > t.cpp
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(t CXX)\nset(CMAKE_CXX_STANDARD 20)\nfind_package(OpenCV REQUIRED)\nmessage(STATUS "OpenCV ${OpenCV_VERSION}")\nadd_executable(t t.cpp)\ntarget_link_libraries(t PRIVATE ${OpenCV_LIBS})\n' > CMakeLists.txt
          cmake -G Ninja -S . -B build
          cmake --build build
          ./build/t.exe

      - name: Trim and zip
        shell: msys2 {0}
        run: |
          root="$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')"
          rm -rf "$root/ucrt64/share/doc" "$root/ucrt64/share/man" "$root/ucrt64/share/info"
          cd "$root"
          7z a -tzip -mx=5 "$GITHUB_WORKSPACE/toolchain-ucrt64.zip" ucrt64
          ls -lh "$GITHUB_WORKSPACE/toolchain-ucrt64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: toolchain-ucrt64.zip
